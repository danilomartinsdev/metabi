services:
  meta-bi:
    build: .
    ports:
      - "3789:3789"
    environment:
      # Defina estas variáveis no arquivo .env (veja .env.example). O container não sobe sem elas.
      NUXT_JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      NUXT_ADMIN_EMAIL: ${ADMIN_EMAIL:?defina ADMIN_EMAIL no .env}
      NUXT_ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?defina ADMIN_PASSWORD_HASH no .env}
      NUXT_COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - meta-bi-data:/app/data
    restart: unless-stopped
volumes:
  meta-bi-data:
